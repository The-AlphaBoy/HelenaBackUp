model:
  default: gpt-4o-mini
  provider: openai
  reasoning_effort: medium
  context_length: 128000
fallback_providers:
  - provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
  - provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
  - provider: groq
    model: qwen/qwen3.6-27b
    base_url: https://api.groq.com/openai/v1
terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180
compression:
  enabled: true
  threshold: 0.5
auxiliary:
  background_review:
    notification_mode: false
  free_only: false
display:
  language: fa
tts:
  provider: edge
  edge:
    voice: fa-IR-DilaraNeural
stt:
  enabled: true
  echo_transcripts: false
  provider: local_command
  local:
    model: base
timezone: Asia/Tehran
approvals:
  destructive_slash_confirm: false
command_allowlist:
  - script execution via -e/-c flag
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
_config_version: 37
platforms:
  telegram:
    enabled: true
    home_channel:
      chat_id: '611447021'
      name: AmirReza
      platform: telegram
      user_id: '611447021'
