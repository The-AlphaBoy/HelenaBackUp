model:
  default: gemini-3.1-flash-lite
  provider: gemini
  reasoning_effort: high
terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180
compression:
  enabled: true
  threshold: 0.5
auxiliary:
  background_review:
    notification_mode: false
display:
  language: fa
tts:
  provider: edge
  edge:
    voice: fa-IR-DilaraNeural
stt:
  enabled: true
  echo_transcripts: false
  provider: local_command
  local:
    model: base
timezone: Asia/Tehran
approvals:
  destructive_slash_confirm: false
command_allowlist:
  - script execution via -e/-c flag
  - delete in root path
  - recursive delete
  - script execution via heredoc
  - git force push (rewrites remote history)
  - git force push short flag (rewrites remote history)
  - execute_code
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
_config_version: 33
platforms:
  telegram:
    enabled: true
    home_channel:
      chat_id: '611447021'
      name: AmirReza
      platform: telegram
      user_id: '611447021'
